name: CI

# A Markdown-only change can't affect lint, build, types or tests, and this
# job runs in a Playwright container for up to 30 minutes. Nothing imports a
# .md file (stories are .tsx/.mdx), so skipping is safe. Branch protection
# requires no status checks, so a skipped run doesn't block merging. Any
# non-Markdown file in the change runs the full job.
on:
  push:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.0-noble
    timeout-minutes: 30 

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        # .yarnrc.yml resolves the @tetrascience-npm scope from JFrog, so the
        # install needs this read token or yarn hits the archive anonymously and
        # fails with "YN0041: Invalid authentication (as an anonymous user)".
        # The publish workflow already supplies it; this job did not.
        env:
          JFROG_ARTIFACTORY_READ_NPM_AUTH: ${{ secrets.JFROG_ARTIFACTORY_READ_NPM_AUTH }}
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Verify Jest consumer support
        run: yarn verify:jest-consumer

      - name: Type Check
        run: yarn typecheck

      - name: Run Tests with Coverage
        run: yarn run test:all:coverage

      - name: Coverage
        uses: tetrascience/ts-ci-cd-lib/coverage-check@main