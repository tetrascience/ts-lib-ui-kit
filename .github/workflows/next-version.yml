name: Next release version

# Reusable: works out the version the next release will get, the way the
# Release workflow will (scripts/release/next-version.ts), so the publish
# workflows can name prereleases for it. Between releases package.json holds
# the version already released, so without this every beta and alpha after
# v1.1.0 would sort *before* 1.1.0.
# - Betas pass `prerelease_tag: beta` and hand `prerelease_version`
#   (1.2.0-beta.3, restarting at 1 for each version) to the shared publish
#   workflow's `prerelease_version` input.
# - PR alphas write `version` into package.json through the shared
#   workflow's `pre_install_command`, which then appends its
#   `-alpha.<run>.<attempt>` suffix.
#
# Callers give this job `permissions: contents: read` and no secrets: it
# installs dependencies, and needs neither an OIDC token nor a registry
# credential (public npm only, see .yarnrc.yml).

on:
  workflow_call:
    inputs:
      prerelease_tag:
        description: "Also compute X.Y.Z-<tag>.N, numbered per version (scripts/release/next-version.ts)"
        type: string
        default: ""
        required: false
    outputs:
      version:
        description: "The next release's X.Y.Z"
        value: ${{ jobs.next-version.outputs.version }}
      prerelease_version:
        description: "X.Y.Z-<prerelease_tag>.N, when prerelease_tag is set"
        value: ${{ jobs.next-version.outputs.prerelease_version }}

permissions:
  contents: read

jobs:
  next-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      prerelease_version: ${{ steps.next.outputs.prerelease_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needs the tags and the commits since the last one
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
      - name: Enable Corepack
        run: corepack enable
      # skip-build: no lifecycle scripts run, and with the yarn cache the
      # rest is a fast link step. A narrower install (only tsx and the
      # analyzer) would have to pin versions outside yarn.lock.
      - name: Install
        run: yarn install --immutable --mode=skip-build
      - name: Compute next release version
        id: next
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
        run: |
          # Callers interpolate these into shell commands, so accept only the
          # exact shapes.
          if [[ -n "$PRERELEASE_TAG" ]]; then
            PRERELEASE_VERSION=$(yarn tsx scripts/release/next-version.ts --prerelease "$PRERELEASE_TAG")
            if [[ ! "$PRERELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+\.[0-9]+$ ]]; then
              echo "Unexpected prerelease version: '$PRERELEASE_VERSION'"
              exit 1
            fi
            VERSION="${PRERELEASE_VERSION%%-*}"
            echo "Next prerelease: $PRERELEASE_VERSION"
            echo "prerelease_version=$PRERELEASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(yarn tsx scripts/release/next-version.ts)
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version: '$VERSION'"
            exit 1
          fi
          echo "Next release: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
