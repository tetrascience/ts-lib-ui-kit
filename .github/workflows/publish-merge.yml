name: Publish Package Internal

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Named and numbered like the public npm betas, so one commit's beta has
  # the same version on both registries. See next-version.yml.
  beta-version:
    permissions:
      contents: read
    uses: ./.github/workflows/next-version.yml
    with:
      prerelease_tag: beta

  publish-internal:
    needs: beta-version
    uses: tetrascience/ts-ci-cd-lib/.github/workflows/publish-npm-package.yml@main
    with:
      prerelease_tag: beta
      prerelease_version: ${{ needs.beta-version.outputs.prerelease_version }}
    secrets:
      AUTH_TOKEN: '${{ secrets.JFROG_ARTIFACTORY_WRITE_NPM_AUTH }}'
      REGISTRY: 'https://registry.npmjs.org'
      PUBLISH_REGISTRY: '${{ secrets.JFROG_ARTIFACTORY_WRITE_NPM_URL }}'

