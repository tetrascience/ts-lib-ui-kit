name: Publish PR

# Opt-in: publishes an installable alpha of a PR only when it carries the
# `alpha` label (and again on each push while the label stays). Every PR used
# to publish one, which cost a full build + test run per push for builds
# almost nobody installed.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Skip for forked PRs since secrets are not available. On `labeled`, run
    # only when the label added is `alpha`, so other labels don't republish.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'alpha') &&
      (github.event.action != 'labeled' || github.event.label.name == 'alpha')
    uses: tetrascience/ts-ci-cd-lib/.github/workflows/publish-npm-package.yml@main
    with:
      prerelease_tag: alpha
    secrets:
      AUTH_TOKEN: '${{ secrets.JFROG_ARTIFACTORY_WRITE_NPM_AUTH }}'
      REGISTRY: 'https://registry.npmjs.org'
      PUBLISH_REGISTRY: '${{ secrets.JFROG_ARTIFACTORY_WRITE_NPM_URL }}'

