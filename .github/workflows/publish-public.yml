name: Publish to Public npm

on:
  push:
    tags: "*"
    branches:
      - main

permissions:
  id-token: write
  contents: read

# One publish at a time per ref, in merge order, so the `beta` dist-tag can't
# end up on an older commit because two runs finished out of order. (GitHub
# keeps one waiting run per group: a run still queued when a newer merge
# arrives is skipped, and the newer beta supersedes it.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  approve:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - run: echo "Approved"

  publish-production:
    if: startsWith(github.ref, 'refs/tags/')
    needs: approve
    uses: tetrascience/ts-ci-cd-lib/.github/workflows/publish-npm-package.yml@main
    with:
      publish_to_public_npm: true
    secrets:
      PUBLISH_REGISTRY: "https://registry.npmjs.org"

  # Betas are named for the next release (1.2.0-beta.N after a feat: since
  # v1.1.0), not the released version in package.json. See next-version.yml.
  beta-version:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/next-version.yml

  publish-beta:
    if: github.ref == 'refs/heads/main'
    needs: beta-version
    uses: tetrascience/ts-ci-cd-lib/.github/workflows/publish-npm-package.yml@main
    with:
      prerelease_tag: beta
      publish_to_public_npm: true
      pre_install_command: >-
        jq --arg v "${{ needs.beta-version.outputs.version }}" '.version = $v' package.json > package.json.tmp &&
        mv package.json.tmp package.json
    secrets:
      PUBLISH_REGISTRY: "https://registry.npmjs.org"
