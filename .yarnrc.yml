# Public npm is the DEFAULT: this package is published publicly
# (@tetrascience-npm/tetrascience-react-ui), so it must only depend on
# publicly-available packages, and external contributors must be able to build it.
npmRegistryServer: "https://registry.npmjs.org"

# ...with one scoped exception: the @tetrascience-npm scope resolves from JFrog.
#
# JFrog is the authoritative source for first-party packages. It carries the
# pre-release builds public npm never sees, which is what lets this kit develop
# against `@tetrascience-npm/request` ahead of a public release — the
# ./telemetry entry point the React bindings need exists only in 0.4.x, and
# public npm's latest is 0.3.0.
#
# This does NOT change what a consumer resolves: `request` is a PEER dependency,
# so the consuming application resolves it from its own registry, and everything
# outside this scope still comes from public npm. It does mean building this
# repo requires JFROG_ARTIFACTORY_READ_NPM_AUTH.
npmScopes:
  tetrascience-npm:
    npmRegistryServer: "https://tetrascience.jfrog.io/artifactory/api/npm/ts-npm-virtual/"
    npmAlwaysAuth: true
    npmAuthIdent: "${JFROG_ARTIFACTORY_READ_NPM_AUTH:-}"

nodeLinker: node-modules

supportedArchitectures:
  cpu:
    - current
    - x64
  os:
    - current
    - linux

yarnPath: .yarn/releases/yarn-4.12.0.cjs

# The @tetrascience-npm scope is served by more than one registry — public npm,
# JFrog's ts-npm-virtual for local/CI installs, and the publish workflow's own
# JFrog repo, which it selects by overriding npmRegistryServer. Those serve
# byte-different archives of identical package content, so a checksum recorded
# against one fails against another:
#
#   YN0018: @tetrascience-npm/ts-connectors-sdk@npm:3.2.0:
#           The remote archive doesn't match the expected checksum
#
# `update` accepts the new archive and rewrites the entry instead of failing the
# install. It does NOT disable integrity checking — yarn still verifies each
# archive it fetches; it just stops treating "same content, different registry"
# as tampering.
checksumBehavior: update
