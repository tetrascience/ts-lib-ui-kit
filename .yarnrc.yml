# Public npm is the DEFAULT: this package is published publicly
# (@tetrascience-npm/tetrascience-react-ui), so it must only depend on
# publicly-available packages, and external contributors must be able to build it.
npmRegistryServer: "https://registry.npmjs.org"

# ...with one scoped exception: the @tetrascience-npm scope resolves from JFrog.
#
# JFrog is the authoritative source for first-party packages. It carries the
# pre-release builds public npm never sees, which is what lets this kit develop
# against `@tetrascience-npm/request` ahead of a public release — the
# ./telemetry entry point the React bindings need exists only in 0.4.x, and
# public npm's latest is 0.3.0.
#
# This does NOT change what a consumer resolves: `request` is a PEER dependency,
# so the consuming application resolves it from its own registry, and everything
# outside this scope still comes from public npm. It does mean building this
# repo requires JFROG_ARTIFACTORY_READ_NPM_AUTH.
npmScopes:
  tetrascience-npm:
    npmRegistryServer: "https://tetrascience.jfrog.io/artifactory/api/npm/ts-npm-virtual/"
    npmAlwaysAuth: true
    npmAuthIdent: "${JFROG_ARTIFACTORY_READ_NPM_AUTH:-}"

nodeLinker: node-modules

supportedArchitectures:
  cpu:
    - current
    - x64
  os:
    - current
    - linux

yarnPath: .yarn/releases/yarn-4.12.0.cjs

# The @tetrascience-npm scope is served by more than one registry — public npm,
# JFrog's ts-npm-virtual for local/CI installs, and the publish workflow's own
# JFrog repo, which it selects by overriding npmRegistryServer. Those serve
# byte-different archives of identical package content, so a checksum recorded
# against one fails against another:
#
#   YN0018: @tetrascience-npm/ts-connectors-sdk@npm:3.2.0:
#           The remote archive doesn't match the expected checksum
#
# `ignore` accepts the differing archive and leaves the lockfile alone.
#
# It must be `ignore`, not `update`. Both tolerate the mismatch, but `update`
# REWRITES the lockfile entry — and CI installs with `--immutable`, which
# forbids any lockfile modification, so `update` trades YN0018 for
#
#   YN0028: The lockfile would have been modified by this install, which is
#           explicitly forbidden.
#
# This is a latent-correctness fix, NOT the cause of the red Vercel deploy —
# switching to `ignore` did not turn Vercel green. See the note below.
#
# Honest scope: this does relax a check. Yarn still resolves the pinned version
# and validates the archive it fetches, but it no longer enforces that the
# archive matches the checksum recorded in the lockfile, so a swapped artifact
# on a first-party registry would not be caught here. Accepted because the
# @tetrascience-npm scope is genuinely served by several registries that emit
# byte-different archives of identical content. Revisit once this kit resolves
# `request` from public npm alone.
checksumBehavior: ignore

# DELIBERATE: this branch depends on a JFrog-only pre-release, which overrides
# the "only publicly-available packages / external contributors must be able to
# build it" note in AGENTS.md. That trade was made knowingly to get a working
# build now; ./telemetry exists only in request 0.4.x and public npm is at
# 0.3.0. Revisit if/when request 0.4.x ships publicly.
#
# The consequence to know: every build environment that installs this repo now
# needs JFROG_ARTIFACTORY_READ_NPM_AUTH. GitHub Actions has it (ci.yml). The
# Vercel Storybook project appears not to, and only someone with Vercel project
# access can add it — it cannot be fixed from this repo.
#
# Evidence it is the install and not the build: `yarn build-storybook` succeeds
# locally, and Vercel went red at 9efff762, the commit that edited THIS FILE and
# nothing else — exactly what invalidates Vercel's dependency cache and forces
# the first uncached install. Unverified; the deploy logs were not reachable.
# The Vercel check does not gate merge (main has no required status checks).
