# Public npm is the ONLY registry: this package is published publicly
# (@tetrascience-npm/tetrascience-react-ui), so it must only depend on
# publicly-available packages, and external contributors must be able to build it.
# The @tetrascience-npm deps this kit needs are all on public npm — request 0.4.0
# (which carries the ./telemetry entry point) and ts-connectors-sdk 3.2.0 — so no
# scoped JFrog exception and no credential is required to install this repo.
npmRegistryServer: "https://registry.npmjs.org"

nodeLinker: node-modules

supportedArchitectures:
  cpu:
    - current
    - x64
  os:
    - current
    - linux

yarnPath: .yarn/releases/yarn-4.12.0.cjs
